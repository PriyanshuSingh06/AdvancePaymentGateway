spring:
  application:
    name: AdvancePaymentSystem

  datasource:
    url: jdbc:postgresql://localhost:5432/paymentgateway
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

payment:
  webhook:
    secret: my-super-secret-webhook-key